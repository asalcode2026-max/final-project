<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creating account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header-container">

            <div class="right-row">
                <a href="#" class="logo">بازارینو</a>
                <a href="#">خانه</a>
                <a href="#">فروشگاه</a>
                <a href="#">دسته بندی ها</a>
                <a href="#"> درباره ما</a>
            </div>

            <div class="left-row">
                <a href="#" class="purchase-btn">سبد خرید.2</a>
                <a href="#" class="login">ورود</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="signup-page">
            <div class="signup-header">
                <h1>ساخت حساب کاربری</h1>
                <p> برای خرید سریعتر ,حساب بازارینو را بسازید.</p>
            </div>

            <form class="signup-form" action="#" method="post">
                <div class="form-group">
                    <label for="email">
                        ایمیل
                    </label>
                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="name@example.com"required>
                </div>
                <div class="form-group">
                    <label for="phone">
                       شماره همراه
                    </label>
                    <input
                    type="tel"
                    id="phone"
                    name="phone"required>
                </div>
                <div class="form-group">
                    <label for="password">
                        رمز عبور
                    </label>
                    <input
                    type="password"
                    id="password"
                    name="password"required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">
                         تکرار رمز عبور
                    </label>
                    <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="رمز عبور را دوباره وارد کنید" required>
                </div>

                <div class="button">
                    <button type="submit" class="btn btn-primary">
                        ثبت نام
                    </button>

                    <button type="reset" class="btn btn-secondary">
                        پاک کردن
                    </button>
                </div>
            </form>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-right">
            بازینو;خرید ساده و مطمئن
        </div>
        <div class="footer-center">
           پشتیبانی-قوانین و شرایط-اینستاگرام
         </div>
        <div class="footer-left">
           ©1405
        </div>

    </footer>
</body>

</html>
